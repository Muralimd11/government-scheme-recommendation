services:
  - type: web
    name: tn-scheme-finder-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && pip install -r requirements.txt && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        value: Admin2026
